
spring.application.name=ecorruta
# PostgreSQL Neon
spring.datasource.url=jdbc:postgresql://ep-dawn-breeze-b5kbsycr-pooler.c-7.us-east-2.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate
spring.jpa.hibernate.ddl-auto=validate
# JWT
jwt.secret=${JWT_SECRET}
# 8 horas: cubre un turno completo del operador sin cerrar su sesión a mitad del recorrido
jwt.expiracion-milisegundos=28800000

# Neon Object Storage
neon.storage.endpoint=${AWS_ENDPOINT_URL_S3}
neon.storage.region=${AWS_REGION}
neon.storage.access-key=${AWS_ACCESS_KEY_ID}
neon.storage.secret-key=${AWS_SECRET_ACCESS_KEY}
neon.storage.bucket=ecoruta-reportes

# Límite de fotografías
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}
verificacion.hmac-secret=${VERIFICACION_HMAC_SECRET}